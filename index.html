<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>REMOTE CONTROL — STEM LAB</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:#090909;
      --panel:#111111;
      --panel2:#151515;
      --line:#2a2a2a;
      --muted:#777;
      --text:#f2f2f2;
      --accent:#fff;
      --danger:#d7d7d7;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
    body { padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
    button,input { font:inherit; }
    button { color:inherit; }
    .app { width:min(760px,100%); margin:0 auto; padding:18px 0 22px; }
    header { border-bottom:1px solid var(--line); padding:3px 2px 17px; margin-bottom:16px; }
    .brand { font-size:12px; letter-spacing:.16em; color:#aaa; margin-bottom:12px; }
    h1 { font-size:clamp(28px,8vw,54px); line-height:.95; letter-spacing:-.045em; margin:0; font-weight:700; }
    .subtitle { margin-top:9px; font-size:12px; letter-spacing:.16em; color:#888; }
    .status-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 0 14px; }
    .status { font-size:11px; letter-spacing:.13em; color:#8b8b8b; }
    .status.ready { color:#d0d0d0; }
    .status.playing { color:#fff; }
    .time { font-variant-numeric:tabular-nums; font-size:12px; color:#aaa; }
    .timeline { width:100%; margin:0 0 17px; }
    input[type="range"] {
      -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track { height:2px; background:#3a3a3a; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
      background:#f4f4f4; margin-top:-7px; border:0;
    }
    input[type="range"]::-moz-range-track { height:2px; background:#3a3a3a; }
    input[type="range"]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#f4f4f4; border:0; }
    .transport { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px; }
    .btn {
      min-height:48px; border:1px solid var(--line); background:#121212; border-radius:10px;
      font-size:12px; font-weight:700; letter-spacing:.12em;
    }
    .btn:active { background:#1e1e1e; transform:translateY(1px); }
    .play { background:#f0f0f0; color:#080808; border-color:#f0f0f0; }
    .play:active { background:#d5d5d5; }
    .stems { display:flex; flex-direction:column; gap:8px; }
    .stem {
      background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 12px 12px;
    }
    .stem-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .stem-name { font-size:13px; font-weight:700; letter-spacing:.08em; }
    .vol { min-width:45px; text-align:right; font-size:12px; color:#aaa; font-variant-numeric:tabular-nums; }
    .stem-controls { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:8px; }
    .stem-slider { min-width:0; }
    .small-btn {
      min-width:60px; min-height:38px; padding:0 9px; border:1px solid #303030; background:#171717;
      border-radius:8px; font-size:10px; font-weight:700; letter-spacing:.08em;
    }
    .small-btn.active { background:#eee; color:#090909; border-color:#eee; }
    .small-btn.muted { background:#292929; color:#fff; }
    .footer-controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }
    .hint { text-align:center; color:#555; font-size:10px; letter-spacing:.08em; margin-top:14px; line-height:1.5; }
    .error { display:none; margin:10px 0 0; padding:10px; border:1px solid #333; border-radius:8px; color:#aaa; font-size:11px; line-height:1.45; }
    .error.show { display:block; }
    @media (min-width:600px) {
      body { padding-left:24px; padding-right:24px; }
      .app { padding-top:30px; }
    }
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">YE / DONDA</div>
    <h1>REMOTE CONTROL</h1>
    <div class="subtitle">STEM LAB · REMOTE CONTROL — 2021</div>
  </header>

  <section aria-label="Transport controls">
    <div class="status-row">
      <div id="status" class="status ready">READY</div>
      <div id="time" class="time">00:00 / 00:00</div>
    </div>
    <div class="timeline">
      <input id="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Track position">
    </div>
    <div class="transport">
      <button id="playPause" class="btn play" type="button">PLAY</button>
      <button id="stop" class="btn" type="button">STOP</button>
    </div>
  </section>

  <section id="stems" class="stems" aria-label="Stem controls"></section>

  <div class="footer-controls">
    <button id="muteAll" class="btn" type="button">MUTE ALL</button>
    <button id="reset" class="btn" type="button">RESET</button>
  </div>

  <div id="error" class="error"></div>
  <div class="hint">4-STEM SYNCHRONIZED PLAYER · LOCAL AUDIO FILES</div>
</main>

<script>
(() => {
  "use strict";

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
    } catch (_) {}
  }

  const tracks = [
    { id:"vocals", label:"🎤 VOCALS", src:"vocals.mp3" },
    { id:"drums",  label:"🥁 DRUMS",  src:"drums.mp3" },
    { id:"bass",   label:"🔊 BASS",   src:"bass.mp3" },
    { id:"other",  label:"🎹 OTHER",  src:"other.mp3" }
  ];

  const audio = new Map();
  const state = new Map();
  let duration = 0;
  let masterReady = false;
  let raf = 0;
  let userSeeking = false;

  const $ = id => document.getElementById(id);
  const stemsEl = $("stems");
  const timeline = $("timeline");
  const timeEl = $("time");
  const statusEl = $("status");
  const playBtn = $("playPause");
  const errorEl = $("error");

  function fmt(sec) {
    if (!Number.isFinite(sec) || sec < 0) sec = 0;
    const s = Math.floor(sec);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add("show");
  }

  function setStatus(text, cls="") {
    statusEl.textContent = text;
    statusEl.className = "status " + cls;
  }

  function renderStems() {
    stemsEl.innerHTML = "";
    for (const t of tracks) {
      const row = document.createElement("div");
      row.className = "stem";
      row.innerHTML = `
        <div class="stem-top">
          <div class="stem-name">${t.label}</div>
          <div class="vol" id="${t.id}-vol">100%</div>
        </div>
        <div class="stem-controls">
          <input class="stem-slider" id="${t.id}-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${t.label} volume">
          <button class="small-btn" id="${t.id}-mute" type="button">MUTE</button>
          <button class="small-btn" id="${t.id}-solo" type="button">SOLO</button>
        </div>`;
      stemsEl.appendChild(row);

      state.set(t.id, { volume:1, muted:false, solo:false });

      const slider = row.querySelector(`#${t.id}-slider`);
      const mute = row.querySelector(`#${t.id}-mute`);
      const solo = row.querySelector(`#${t.id}-solo`);

      slider.addEventListener("input", () => {
        const s = state.get(t.id);
        s.volume = Number(slider.value);
        row.querySelector(`#${t.id}-vol`).textContent = Math.round(s.volume * 100) + "%";
        applyMix();
      });

      mute.addEventListener("click", () => {
        const s = state.get(t.id);
        s.muted = !s.muted;
        mute.classList.toggle("muted", s.muted);
        mute.textContent = s.muted ? "MUTED" : "MUTE";
        applyMix();
      });

      solo.addEventListener("click", () => {
        const s = state.get(t.id);
        s.solo = !s.solo;
        solo.classList.toggle("active", s.solo);
        applyMix();
      });
    }
  }

  function hasSolo() {
    for (const t of tracks) if (state.get(t.id).solo) return true;
    return false;
  }

  function applyMix() {
    const soloActive = hasSolo();
    for (const t of tracks) {
      const a = audio.get(t.id);
      if (!a) continue;
      const s = state.get(t.id);
      const audible = !s.muted && (!soloActive || s.solo);
      a.volume = audible ? s.volume : 0;
    }
  }

  function currentPosition() {
    const a = audio.get("vocals");
    return a ? a.currentTime : 0;
  }

  function setAllTime(sec) {
    sec = Math.max(0, Math.min(Number(sec) || 0, duration || 0));
    for (const t of tracks) {
      const a = audio.get(t.id);
      if (a && Math.abs(a.currentTime - sec) > 0.025) {
        try { a.currentTime = sec; } catch (_) {}
      }
    }
    timeline.value = String(sec);
    timeEl.textContent = `${fmt(sec)} / ${fmt(duration)}`;
  }

  async function playAll() {
    const master = audio.get("vocals");
    if (!master) return;

    try {
      setStatus("LOADING…");

      // Wait only for metadata/readiness; playback itself is triggered directly
      // from the user's PLAY tap. Safari/iOS is stricter about this than desktop browsers.
      const pos = currentPosition();

      for (const t of tracks) {
        const a = audio.get(t.id);
        if (!a) continue;
        try { a.pause(); } catch (_) {}
        try { a.currentTime = pos; } catch (_) {}
      }

      applyMix();

      // Call play() immediately for every track from the same user gesture.
      // We do not wait for one play() promise before starting the next.
      const attempts = tracks.map(t => {
        const a = audio.get(t.id);
        return a ? a.play() : Promise.reject(new Error("missing audio"));
      });

      const results = await Promise.allSettled(attempts);
      const failed = results.some(r => r.status === "rejected");

      if (failed) {
        // One more direct synchronization/start attempt. This is useful on
        // iOS Safari when a media element has just finished loading.
        for (const t of tracks) {
          const a = audio.get(t.id);
          if (a && a.paused) {
            try { await a.play(); } catch (_) {}
          }
        }
      }

      const playingCount = tracks.filter(t => {
        const a = audio.get(t.id);
        return a && !a.paused;
      }).length;

      if (playingCount === tracks.length) {
        setStatus("PLAYING", "playing");
        playBtn.textContent = "PAUSE";
        startClock();
      } else {
        for (const t of tracks) {
          const a = audio.get(t.id);
          if (a) a.pause();
        }
        setStatus("READY", "ready");
        showError("Playback was blocked by the browser. Tap PLAY once more. If it still fails, check that all four MP3 files are in the repository root and open the page directly in Safari first.");
      }
    } catch (_) {
      setStatus("READY", "ready");
      showError("Could not start the four audio files. Check that vocals.mp3, drums.mp3, bass.mp3 and other.mp3 are in the same folder as index.html.");
    }
  }

  function pauseAll() {
    for (const t of tracks) {
      const a = audio.get(t.id);
      if (a) a.pause();
    }
    setStatus("PAUSED");
    playBtn.textContent = "PLAY";
    stopClock();
  }

  function stopAll() {
    pauseAll();
    setAllTime(0);
    setStatus("READY", "ready");
  }

  function startClock() {
    stopClock();
    const tick = () => {
      const pos = currentPosition();
      if (!userSeeking) {
        timeline.value = String(Math.min(pos, duration || pos));
        timeEl.textContent = `${fmt(pos)} / ${fmt(duration)}`;
      }
      if (!audio.get("vocals")?.paused) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  function stopClock() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  function handleEnded() {
    // Treat the main (vocals) track as the master clock.
    if (this === audio.get("vocals")) {
      for (const t of tracks) {
        const a = audio.get(t.id);
        if (a) a.pause();
      }
      setAllTime(duration);
      setStatus("ENDED");
      playBtn.textContent = "PLAY";
      stopClock();
    }
  }

  function syncOnPlay(event) {
    const master = audio.get("vocals");
    if (!master || event.target === master) return;
    // Keep secondary tracks aligned with the master if the browser starts them at slightly different times.
    const diff = event.target.currentTime - master.currentTime;
    if (Math.abs(diff) > 0.05) event.target.currentTime = master.currentTime;
  }

  function initAudio() {
    let loaded = 0;
    for (const t of tracks) {
      const a = new Audio();
      a.preload = "auto";
      a.src = t.src;
      a.volume = 1;
      audio.set(t.id, a);

      a.addEventListener("loadedmetadata", () => {
        loaded++;
        // Main timeline is based on VOCALS; if unavailable, use the longest loaded track.
        const master = audio.get("vocals");
        if (master && Number.isFinite(master.duration) && master.duration > 0) {
          duration = master.duration;
        } else {
          duration = Math.max(duration, Number.isFinite(a.duration) ? a.duration : 0);
        }
        timeline.max = String(duration || 0);
        timeEl.textContent = `${fmt(currentPosition())} / ${fmt(duration)}`;
        if (loaded === tracks.length) masterReady = true;
      });

      a.addEventListener("error", () => {
        showError(`Could not load ${t.src}. Put the MP3 file in the same GitHub Pages folder as index.html.`);
      });

      a.addEventListener("ended", handleEnded);
      a.addEventListener("play", syncOnPlay);
    }
    applyMix();
  }

  playBtn.addEventListener("click", () => {
    const master = audio.get("vocals");
    if (!master) return;
    if (master.paused) playAll();
    else pauseAll();
  });

  $("stop").addEventListener("click", stopAll);

  timeline.addEventListener("pointerdown", () => { userSeeking = true; });
  timeline.addEventListener("pointerup", () => {
    userSeeking = false;
    setAllTime(Number(timeline.value));
  });
  timeline.addEventListener("input", () => {
    userSeeking = true;
    const sec = Number(timeline.value);
    timeEl.textContent = `${fmt(sec)} / ${fmt(duration)}`;
    for (const t of tracks) {
      const a = audio.get(t.id);
      if (a) {
        try { a.currentTime = sec; } catch (_) {}
      }
    }
  });

  $("muteAll").addEventListener("click", () => {
    const anyAudible = tracks.some(t => {
      const s = state.get(t.id);
      return !s.muted && s.volume > 0;
    });
    for (const t of tracks) {
      state.get(t.id).muted = anyAudible;
      const b = $(`${t.id}-mute`);
      b.classList.toggle("muted", anyAudible);
      b.textContent = anyAudible ? "MUTED" : "MUTE";
    }
    applyMix();
  });

  $("reset").addEventListener("click", () => {
    pauseAll();
    for (const t of tracks) {
      const s = state.get(t.id);
      s.volume = 1;
      s.muted = false;
      s.solo = false;
      $(`${t.id}-slider`).value = "1";
      $(`${t.id}-vol`).textContent = "100%";
      const mute = $(`${t.id}-mute`);
      mute.classList.remove("muted");
      mute.textContent = "MUTE";
      $(`${t.id}-solo`).classList.remove("active");
    }
    applyMix();
    setAllTime(0);
    setStatus("READY", "ready");
    errorEl.classList.remove("show");
  });

  renderStems();
  initAudio();
})();
</script>
</body>
</html>
