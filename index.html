<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>REMOTE CONTROL — STEM LAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080808;--body:#111;--panel:#181818;--edge:#343434;--edge2:#454545;--ink:#eee;--dim:#8f8f8f;--metal:#272727}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}.app{width:min(100%,520px);margin:auto}.device{position:relative;background:linear-gradient(#181818,#101010);border:1px solid #3a3a3a;border-radius:6px;padding:18px 14px 14px;box-shadow:0 8px 0 #030303,0 14px 32px #000}.device:before{content:"";position:absolute;inset:6px;border:1px solid #242424;pointer-events:none;border-radius:3px}.brand{position:relative;text-align:center;font-size:10px;letter-spacing:.24em;color:#aaa;text-transform:uppercase}.model{position:relative;text-align:center;margin-top:7px;font-size:20px;line-height:1;letter-spacing:.14em;font-weight:700}.track{position:relative;text-align:center;margin-top:8px;font-size:9px;letter-spacing:.18em;color:#737373;text-transform:uppercase}.transport{position:relative;margin-top:17px;padding:10px 9px 7px;border:1px solid #2c2c2c;background:#101010}.status-row{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}.time{font-variant-numeric:tabular-nums;letter-spacing:.05em}.timeline{display:block;width:100%;height:28px;margin:3px 0 0}.play-row{display:flex;justify-content:center;margin-top:6px}.play{width:62px;height:32px;border:1px solid #666;border-radius:3px;background:#d8d8d8;color:#111;font-size:10px;font-weight:700;letter-spacing:.12em;box-shadow:inset 0 1px #fff,0 2px 0 #050505}.play:active,.hardware:active{transform:translateY(1px);box-shadow:inset 0 1px #111,0 1px 0 #050505}.mixer{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;padding:12px 7px 10px;border:1px solid #2c2c2c;background:#101010}.stem{min-width:0;text-align:center}.stem-name{font-size:9px;letter-spacing:.1em;color:#bdbdbd;white-space:nowrap;overflow:hidden}.stem-value{margin-top:5px;color:#858585;font-size:9px;font-variant-numeric:tabular-nums}.stem-controls{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:6px}.stem-slider{width:116px;height:28px;transform:rotate(-90deg);margin:38px 0}.stem-slider::-webkit-slider-runnable-track{height:4px;background:#3b3b3b;border:1px solid #555;border-radius:1px}.stem-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:2px;background:#bcbcbc;border:1px solid #eee;box-shadow:inset 0 1px #fff,0 2px 2px #000}.stem-slider::-moz-range-track{height:4px;background:#3b3b3b;border:1px solid #555}.stem-slider::-moz-range-thumb{width:20px;height:20px;border-radius:2px;background:#bcbcbc;border:1px solid #eee}.hardware{width:100%;min-height:30px;border:1px solid #4b4b4b;border-radius:3px;background:linear-gradient(#303030,#1c1c1c);color:#bbb;font-size:8px;font-weight:700;letter-spacing:.08em;box-shadow:inset 0 1px #555,0 2px 0 #050505}.hardware.active{background:#d0d0d0;color:#111;border-color:#eee}.hardware.muted{background:#080808;color:#eee;border-color:#666}.bottom{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bottom button{min-height:38px}.sample{position:relative;margin-top:12px;padding-top:10px;border-top:1px solid #2b2b2b;text-align:center}.sample-pad{width:100%;min-height:42px;border:1px solid #4a4a4a;background:#1e1e1e;color:#aaa;border-radius:3px;font-size:9px;letter-spacing:.18em;font-weight:700}.error{display:none;position:relative;margin-top:10px;padding:8px;border:1px solid #555;background:#181818;color:#ddd;font-size:10px;line-height:1.4}.error.show{display:block}.note{text-align:center;color:#5e5e5e;font-size:9px;letter-spacing:.16em;margin-top:12px;text-transform:uppercase}input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none}input[type=range]::-moz-range-thumb{cursor:pointer}@media(max-width:340px){.device{padding-left:10px;padding-right:10px}.mixer{gap:3px;padding-left:3px;padding-right:3px}.stem-slider{width:108px}.hardware{font-size:7px}}
</style>
</head>
<body><main class="app"><section class="device">
<div class="brand">TE / YE — STEM LAB</div><div class="model">REMOTE CONTROL</div><div class="track">DONDA · 2021</div>
<section class="transport"><div class="status-row"><span id="status" class="status ready">READY</span><span id="time" class="time">00:00 / 00:00</span></div><input id="timeline" class="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline"><div class="play-row"><button id="play" class="play" type="button">PLAY</button></div></section>
<section id="stems" class="mixer" aria-label="Stem controls"></section>
<div class="bottom"><button id="muteAll" class="hardware" type="button">MUTE ALL</button><button id="reset" class="hardware" type="button">RESET</button></div>
<div class="sample"><button id="samplePad" class="sample-pad" type="button">SAMPLE PAD · READY</button></div>
<div id="error" class="error" role="alert"></div></section><div class="note">4 CHANNEL HARDWARE INTERFACE</div></main>
<script>
(()=>{'use strict';
const AUDIO_FILES={vocals:'Vocals.mp3',drums:'Drums.mp3',bass:'Bass.mp3',other:'Other.mp3'};
const STEMS=[['vocals','VOC'],['drums','DRUM'],['bass','BASS'],['other','OTHER']];const audio={},gains={},state={};let ctx=null,duration=0,playing=false,seeking=false,raf=0,backup=null;const $=id=>document.getElementById(id);STEMS.forEach(([id])=>state[id]={volume:1,muted:false,solo:false});
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
function fmt(n){n=Number.isFinite(n)?Math.max(0,n):0;let s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}function error(t){$('error').textContent=t;$('error').classList.add('show')}function clearError(){$('error').classList.remove('show')}function solo(){return STEMS.some(([id])=>state[id].solo)}
function applyMix(){let has=solo();STEMS.forEach(([id])=>{let s=state[id],v=s.muted||(has&&!s.solo)?0:s.volume;if(gains[id])gains[id].gain.value=v;else if(audio[id])audio[id].volume=v})}function display(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));$('timeline').value=n;$('time').textContent=fmt(n)+' / '+fmt(duration)}function seek(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));STEMS.forEach(([id])=>{try{audio[id].currentTime=n}catch(e){}});display(n)}
function render(){let h='';STEMS.forEach(([id,label])=>h+=`<div class="stem"><div class="stem-name">${label}</div><input id="${id}Volume" class="stem-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${label} volume"><div id="${id}Value" class="stem-value">100%</div><div class="stem-controls"><button id="${id}Mute" class="hardware" type="button">MUTE</button><button id="${id}Solo" class="hardware" type="button">SOLO</button></div></div>`);$('stems').innerHTML=h;STEMS.forEach(([id])=>{let s=state[id];$(id+'Volume').addEventListener('input',e=>{s.volume=Number(e.target.value);$(id+'Value').textContent=Math.round(s.volume*100)+'%';applyMix()});$(id+'Mute').addEventListener('click',()=>{s.muted=!s.muted;$(id+'Mute').classList.toggle('muted',s.muted);$(id+'Mute').textContent=s.muted?'MUTED':'MUTE';applyMix()});$(id+'Solo').addEventListener('click',()=>{s.solo=!s.solo;$(id+'Solo').classList.toggle('active',s.solo);applyMix()})})}
function graph(){if(ctx)return;let C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx=new C();STEMS.forEach(([id])=>{let src=ctx.createMediaElementSource(audio[id]),g=ctx.createGain();src.connect(g).connect(ctx.destination);gains[id]=g});if(ctx.state==='suspended')ctx.resume();applyMix()}function stopClock(){cancelAnimationFrame(raf);raf=0}function clock(){stopClock();let f=()=>{if(!playing)return;if(!seeking)display(audio.vocals.currentTime);if(!audio.vocals.paused)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function pause(){STEMS.forEach(([id])=>audio[id].pause());playing=false;$('play').textContent='PLAY';status('PAUSED','paused');stopClock()}async function play(){graph();let p=audio.vocals.currentTime;STEMS.forEach(([id])=>{try{audio[id].currentTime=p}catch(e){}});applyMix();try{await Promise.all(STEMS.map(([id])=>audio[id].play()));playing=true;$('play').textContent='PAUSE';status('PLAYING','playing');clearError();clock()}catch(e){pause();error('Playback failed. Tap PLAY again.')}}
STEMS.forEach(([id])=>{let a=new Audio(AUDIO_FILES[id]);a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');audio[id]=a;a.addEventListener('loadedmetadata',()=>{if(id==='vocals')duration=a.duration;else duration=Math.max(duration,a.duration);$('timeline').max=duration;display(audio.vocals.currentTime)});a.addEventListener('error',()=>error('Could not load: '+AUDIO_FILES[id]));a.addEventListener('ended',()=>{if(id==='vocals'){pause();seek(duration);status('ENDED')}})});
$('play').addEventListener('click',()=>playing?pause():play());$('timeline').addEventListener('pointerdown',()=>seeking=true);$('timeline').addEventListener('input',e=>{display(e.target.value);STEMS.forEach(([id])=>{try{audio[id].currentTime=Number(e.target.value)}catch(x){}})});['change','pointerup'].forEach(e=>$('timeline').addEventListener(e,()=>{seeking=false;seek($('timeline').value)}));
$('muteAll').addEventListener('click',()=>{if(!backup){backup={};STEMS.forEach(([id])=>{backup[id]=state[id].muted;state[id].muted=true;$(id+'Mute').classList.add('muted');$(id+'Mute').textContent='MUTED'});$('muteAll').textContent='UNMUTE'}else{STEMS.forEach(([id])=>{state[id].muted=!!backup[id];$(id+'Mute').classList.toggle('muted',state[id].muted);$(id+'Mute').textContent=state[id].muted?'MUTED':'MUTE'});backup=null;$('muteAll').textContent='MUTE ALL'}applyMix()});$('reset').addEventListener('click',()=>{pause();STEMS.forEach(([id])=>{state[id]={volume:1,muted:false,solo:false};$(id+'Volume').value=1;$(id+'Value').textContent='100%';$(id+'Mute').className='hardware';$(id+'Mute').textContent='MUTE';$(id+'Solo').className='hardware'});backup=null;$('muteAll').textContent='MUTE ALL';clearError();seek(0);status('READY','ready');applyMix()});
function playSample(){/* Reserved for a future independent sample MP3. It is intentionally not connected to the four stems. */}$('samplePad').addEventListener('click',playSample);render();display(0);applyMix();
})();
</script></body></html>
