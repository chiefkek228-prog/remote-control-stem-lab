<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>REMOTE CONTROL — STEM LAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090909;--panel:#151515;--line:#333;--text:#f5f5f5;--muted:#999;--white:#eee}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.app{width:min(760px,100%);margin:auto}.header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.eyebrow,.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.eyebrow{margin-bottom:8px}h1{margin:0;font-size:clamp(34px,9vw,64px);line-height:.88;letter-spacing:-.07em}.sub{margin-top:10px}.top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.12em}.time{font-variant-numeric:tabular-nums;white-space:nowrap}#timeline{display:block;width:100%;height:40px;margin:4px 0 10px}.button,.mini{border:1px solid var(--line);border-radius:9px;background:#181818;color:var(--text);font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.button{width:100%;min-height:48px;font-size:11px}.button.primary{background:var(--white);border-color:var(--white);color:#070707}.transport{margin-bottom:16px}.stems{display:grid;gap:9px}.stem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stem-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.label{font-size:12px;font-weight:700;letter-spacing:.1em}.value{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}.volume{width:100%;height:36px}.mini{min-width:64px;min-height:42px;padding:0 7px;font-size:9px}.mini.active{background:var(--white);border-color:var(--white);color:#070707}.mini.muted{background:#333}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.error{display:none;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px;color:#ddd;font-size:11px;line-height:1.45}.error.show{display:block}.note{text-align:center;color:#555;font-size:10px;letter-spacing:.12em;margin-top:12px;text-transform:uppercase}input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:4px;background:#4a4a4a;border-radius:4px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border:0;border-radius:50%;background:#f5f5f5;margin-top:-9px}input[type=range]::-moz-range-track{height:4px;background:#4a4a4a}input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#f5f5f5}@media(max-width:360px){.mini{min-width:56px;padding:0 5px}.label{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="eyebrow">YE / DONDA</div><h1>REMOTE CONTROL</h1><div class="sub">STEM LAB · REMOTE CONTROL — 2021</div></header>
<section><div class="top"><span id="status">READY</span><span id="time" class="time">00:00 / 00:00</span></div><input id="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline"><div class="transport"><button id="play" class="button primary" type="button">PLAY</button></div></section>
<section id="stems" class="stems" aria-label="Stem controls"></section>
<div class="bottom"><button id="muteAll" class="button" type="button">MUTE ALL</button><button id="reset" class="button" type="button">RESET</button></div>
<div id="error" class="error" role="alert"></div><div class="note">4-STEM SYNCHRONIZED PLAYER</div>
</main>
<script>
(function(){
'use strict';
const AUDIO_FILES={vocals:'Vocals.mp3',drums:'Drums.mp3',bass:'Bass.mp3',other:'Other.mp3'};
const STEMS=[{id:'vocals',label:'🎤 VOCALS'},{id:'drums',label:'🥁 DRUMS'},{id:'bass',label:'🔊 BASS'},{id:'other',label:'🎹 OTHER'}];
const audio={};const state={};let duration=0;let isPlaying=false;let animation=0;let seeking=false;let muteBackup=null;
const byId=function(id){return document.getElementById(id)};
STEMS.forEach(function(s){state[s.id]={volume:1,muted:false,solo:false}});
const telegram=window.Telegram&&window.Telegram.WebApp;if(telegram){try{telegram.ready();telegram.expand()}catch(e){}}
function formatTime(value){var n=Number.isFinite(value)?Math.max(0,value):0;var seconds=Math.floor(n);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function setStatus(value){byId('status').textContent=value}
function showError(value){byId('error').textContent=value;byId('error').classList.add('show')}
function clearError(){byId('error').textContent='';byId('error').classList.remove('show')}
function anySolo(){return STEMS.some(function(s){return state[s.id].solo})}
function updateMix(){var solo=anySolo();STEMS.forEach(function(s){var m=state[s.id];if(audio[s.id])audio[s.id].volume=(m.muted||(solo&&!m.solo))?0:m.volume})}
function updateDisplay(value){var n=Math.max(0,Math.min(Number(value)||0,duration||0));byId('timeline').value=String(n);byId('time').textContent=formatTime(n)+' / '+formatTime(duration)}
function seekAll(value){var n=Math.max(0,Math.min(Number(value)||0,duration||0));STEMS.forEach(function(s){try{audio[s.id].currentTime=n}catch(e){}});updateDisplay(n)}
function makeControls(){var html='';STEMS.forEach(function(s){html+='<article class="stem"><div class="stem-head"><span class="label">'+s.label+'</span><span id="'+s.id+'-value" class="value">100%</span></div><div class="controls"><input id="'+s.id+'-volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="'+s.label+' volume"><button id="'+s.id+'-mute" class="mini" type="button">MUTE</button><button id="'+s.id+'-solo" class="mini" type="button">SOLO</button></div></article>'});byId('stems').innerHTML=html;STEMS.forEach(bindStemControls)}
function bindStemControls(s){var m=state[s.id];var slider=byId(s.id+'-volume');var mute=byId(s.id+'-mute');var solo=byId(s.id+'-solo');slider.addEventListener('input',function(){m.volume=Number(slider.value);byId(s.id+'-value').textContent=Math.round(m.volume*100)+'%';updateMix()});slider.addEventListener('change',function(){m.volume=Number(slider.value);updateMix()});mute.addEventListener('click',function(){m.muted=!m.muted;mute.classList.toggle('muted',m.muted);mute.textContent=m.muted?'MUTED':'MUTE';updateMix()});solo.addEventListener('click',function(){m.solo=!m.solo;solo.classList.toggle('active',m.solo);updateMix()})}
function stopClock(){if(animation)cancelAnimationFrame(animation);animation=0}
function startClock(){stopClock();function frame(){if(!isPlaying)return;if(!seeking)updateDisplay(audio.vocals.currentTime);if(!audio.vocals.paused)animation=requestAnimationFrame(frame)}animation=requestAnimationFrame(frame)}
function pauseAll(){STEMS.forEach(function(s){if(audio[s.id])audio[s.id].pause()});isPlaying=false;byId('play').textContent='PLAY';setStatus('PAUSED');stopClock()}
function playAll(){var position=audio.vocals.currentTime;STEMS.forEach(function(s){try{audio[s.id].currentTime=position}catch(e){}});updateMix();var attempts=STEMS.map(function(s){return audio[s.id].play()});Promise.all(attempts).then(function(){isPlaying=true;byId('play').textContent='PAUSE';setStatus('PLAYING');clearError();startClock()}).catch(function(){pauseAll();showError('Playback could not start. Check the four MP3 files.')})}
function createAudio(){STEMS.forEach(function(s){var a=new Audio();a.src=AUDIO_FILES[s.id];a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');audio[s.id]=a;a.addEventListener('loadedmetadata',function(){if(s.id==='vocals')duration=a.duration;else duration=Math.max(duration,a.duration);byId('timeline').max=String(duration);updateDisplay(audio.vocals.currentTime)});a.addEventListener('error',function(){showError('Could not load: '+AUDIO_FILES[s.id])});a.addEventListener('ended',function(){if(s.id==='vocals'){pauseAll();seekAll(duration);setStatus('ENDED')}})})}
byId('play').addEventListener('click',function(){if(isPlaying)pauseAll();else playAll()});byId('timeline').addEventListener('pointerdown',function(){seeking=true});byId('timeline').addEventListener('input',function(){var value=Number(byId('timeline').value);updateDisplay(value);STEMS.forEach(function(s){try{audio[s.id].currentTime=value}catch(e){}})});byId('timeline').addEventListener('change',function(){seeking=false;seekAll(byId('timeline').value)});byId('timeline').addEventListener('pointerup',function(){seeking=false;seekAll(byId('timeline').value)});
byId('muteAll').addEventListener('click',function(){if(!muteBackup){muteBackup={};STEMS.forEach(function(s){muteBackup[s.id]=state[s.id].muted;state[s.id].muted=true;byId(s.id+'-mute').classList.add('muted');byId(s.id+'-mute').textContent='MUTED'});byId('muteAll').textContent='UNMUTE ALL'}else{STEMS.forEach(function(s){state[s.id].muted=!!muteBackup[s.id];byId(s.id+'-mute').classList.toggle('muted',state[s.id].muted);byId(s.id+'-mute').textContent=state[s.id].muted?'MUTED':'MUTE'});muteBackup=null;byId('muteAll').textContent='MUTE ALL'}updateMix()});
byId('reset').addEventListener('click',function(){pauseAll();STEMS.forEach(function(s){state[s.id]={volume:1,muted:false,solo:false};byId(s.id+'-volume').value='1';byId(s.id+'-value').textContent='100%';byId(s.id+'-mute').className='mini';byId(s.id+'-mute').textContent='MUTE';byId(s.id+'-solo').className='mini'});muteBackup=null;byId('muteAll').textContent='MUTE ALL';clearError();seekAll(0);setStatus('READY');updateMix()});
makeControls();createAudio();updateDisplay(0);updateMix();
})();
</script>
</body>
</html>
