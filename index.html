<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>REMOTE CONTROL — STEM LAB</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090909;
      --device: #151515;
      --well: #0d0d0d;
      --line: #3a3a3a;
      --text: #f2f2f2;
      --muted: #8f8f8f;
      --active: #eeeeee;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
    }

    button, input { font: inherit; }

    .app {
      width: min(520px, 100%);
      margin: 0 auto;
    }

    .device {
      background: var(--device);
      border: 1px solid #424242;
      border-radius: 7px;
      padding: 18px 14px 14px;
      box-shadow: 0 7px #030303, 0 16px 32px rgba(0,0,0,0.86);
    }

    .brand, .track, .help {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: var(--muted);
    }

    .model {
      text-align: center;
      margin-top: 7px;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.13em;
      font-weight: 700;
    }

    .track { margin-top: 8px; }

    .transport {
      margin-top: 17px;
      padding: 10px;
      background: var(--well);
      border: 1px solid #2d2d2d;
      border-radius: 3px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .time { font-variant-numeric: tabular-nums; white-space: nowrap; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      width: 100%;
      height: 30px;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #3f3f3f;
      border: 1px solid #5a5a5a;
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 2px;
      background: #d9d9d9;
      border: 1px solid #f3f3f3;
      margin-top: -9px;
      box-shadow: inset 0 1px #ffffff, 0 2px 2px rgba(0,0,0,0.8);
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      background: #3f3f3f;
      border: 1px solid #5a5a5a;
      border-radius: 2px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 2px;
      background: #d9d9d9;
      border: 1px solid #f3f3f3;
      box-shadow: inset 0 1px #ffffff, 0 2px 2px rgba(0,0,0,0.8);
    }

    .timeline {
      display: block;
      width: 100%;
      height: 30px;
      margin: 4px 0;
    }

    .play-wrap { text-align: center; }

    .play, .hardware, .sample {
      border: 1px solid #5a5a5a;
      border-radius: 3px;
      background: linear-gradient(#373737, #1b1b1b);
      color: #dddddd;
      box-shadow: inset 0 1px #555, 0 2px #050505;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .play {
      width: 70px;
      height: 32px;
      background: #d9d9d9;
      color: #111111;
      border-color: #eeeeee;
      font-size: 9px;
    }

    .play:active, .hardware:active, .sample:active { transform: translateY(1px); }

    .mixer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
      padding: 13px 8px 11px;
      background: var(--well);
      border: 1px solid #2f2f2f;
      border-radius: 3px;
    }

    .stem {
      text-align: center;
      min-width: 0;
    }

    .stem-name {
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #c7c7c7;
      text-transform: uppercase;
    }

    .stem-value {
      font-size: 9px;
      color: var(--muted);
      margin: 3px 0;
      font-variant-numeric: tabular-nums;
    }

    .slider-box {
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stem-slider {
      width: 104px;
      height: 30px;
      transform: rotate(-90deg);
      touch-action: none;
    }

    .stem-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .hardware {
      width: 100%;
      min-height: 31px;
      padding: 0 2px;
      font-size: 7px;
    }

    .hardware.active {
      background: var(--active);
      color: #111111;
      border-color: #eeeeee;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .bottom .hardware { min-height: 38px; }

    .sample-wrap {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #303030;
    }

    .sample {
      width: 100%;
      min-height: 43px;
      font-size: 9px;
    }

    .sample.active {
      background: var(--active);
      color: #111111;
    }

    .error {
      display: none;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #555;
      color: #dddddd;
      font-size: 10px;
      line-height: 1.4;
    }

    .error.show { display: block; }

    .help {
      margin-top: 12px;
      color: #555555;
      line-height: 1.5;
    }

    @media (max-width: 340px) {
      .device { padding-left: 10px; padding-right: 10px; }
      .mixer { gap: 4px; padding-left: 4px; padding-right: 4px; }
      .stem-name { font-size: 8px; }
      .stem-slider { width: 98px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="device">
      <div class="brand">TE / YE — STEM LAB</div>
      <div class="model">REMOTE CONTROL</div>
      <div class="track">DONDA · 2021</div>

      <section class="transport">
        <div class="status-row">
          <span id="status">READY</span>
          <span id="time" class="time">00:00 / 00:00</span>
        </div>

        <input id="timeline" class="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline" />

        <div class="play-wrap">
          <button id="play" class="play" type="button">PLAY</button>
        </div>
      </section>

      <section id="mixer" class="mixer" aria-label="Stem controls"></section>

      <div class="bottom">
        <button id="muteAll" class="hardware" type="button">MUTE ALL</button>
        <button id="reset" class="hardware" type="button">RESET</button>
      </div>

      <div class="sample-wrap">
        <button id="sampleButton" class="sample" type="button">SAMPLE GLOBGLOGABGALAB</button>
      </div>

      <div id="error" class="error" role="alert"></div>
    </section>

    <div class="help">IF SOMETHING DOES NOT WORK, RELOAD THE PAGE</div>
  </main>

  <script>
    (() => {
      'use strict';

      const STEMS = [
        { id: 'vocals', label: 'VOC' },
        { id: 'drums', label: 'DRUM' },
        { id: 'bass', label: 'BASS' },
        { id: 'other', label: 'OTHER' }
      ];

      const FILES = {
        vocals: 'Vocals.mp3',
        drums: 'Drums.mp3',
        bass: 'Bass.mp3',
        other: 'Other.mp3'
      };

      const SAMPLE_FILE = 'Sample.mp3';
      const audio = {};
      const state = {};
      let duration = 0;
      let isPlaying = false;
      let seeking = false;
      let rafId = 0;
      let globalMute = false;
      let sampleAudio = null;

      const $ = (id) => document.getElementById(id);

      STEMS.forEach(stem => {
        state[stem.id] = { volume: 1, solo: false };
      });

      if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (_) {}
      }

      function formatTime(value) {
        const safe = Number.isFinite(value) ? Math.max(0, value) : 0;
        const totalSeconds = Math.floor(safe);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }

      function setStatus(text) {
        $('status').textContent = text;
      }

      function showError(message) {
        const el = $('error');
        el.textContent = message;
        el.classList.add('show');
      }

      function clearError() {
        $('error').textContent = '';
        $('error').classList.remove('show');
      }

      function anySolo() {
        return STEMS.some(stem => state[stem.id].solo);
      }

      function applyMix() {
        const soloActive = anySolo();

        STEMS.forEach(stem => {
          const item = state[stem.id];
          const el = audio[stem.id];
          if (!el) return;

          const shouldMute = globalMute || (soloActive && !item.solo);
          el.volume = shouldMute ? 0 : item.volume;
        });
      }

      function updateDisplay(value) {
        const safe = Math.max(0, Math.min(Number(value) || 0, duration || 0));
        $('timeline').value = String(safe);
        $('time').textContent = formatTime(safe) + ' / ' + formatTime(duration);
      }

      function seekAll(value) {
        const safe = Math.max(0, Math.min(Number(value) || 0, duration || 0));
        STEMS.forEach(stem => {
          const el = audio[stem.id];
          if (!el) return;
          try { el.currentTime = safe; } catch (_) {}
        });
        updateDisplay(safe);
      }

      function stopAnimation() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      function startAnimation() {
        stopAnimation();
        const tick = () => {
          if (!isPlaying) return;
          if (!seeking) updateDisplay(audio.vocals.currentTime);
          if (!audio.vocals.paused) rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
      }

      function pauseAll() {
        STEMS.forEach(stem => {
          const el = audio[stem.id];
          if (!el) return;
          try { el.pause(); } catch (_) {}
        });

        isPlaying = false;
        $('play').textContent = 'PLAY';
        setStatus('PAUSED');
        stopAnimation();
      }

      async function playAll() {
        const master = audio.vocals;
        if (!master) {
          showError('Could not load: ' + FILES.vocals);
          return;
        }

        const position = master.currentTime || 0;
        STEMS.forEach(stem => {
          const el = audio[stem.id];
          if (!el) return;
          try { el.currentTime = position; } catch (_) {}
        });

        applyMix();

        const result = await Promise.allSettled(
          STEMS.map(stem => audio[stem.id].play().catch(() => Promise.resolve()))
        );

        const failed = result.some(item => item.status === 'rejected');
        if (failed) {
          pauseAll();
          showError('Playback failed. Tap PLAY again.');
          return;
        }

        isPlaying = true;
        $('play').textContent = 'PAUSE';
        setStatus('PLAYING');
        clearError();
        startAnimation();
      }

      function renderMixer() {
        let html = '';

        STEMS.forEach(stem => {
          html += `
            <div class="stem">
              <div class="stem-name">${stem.label}</div>
              <div class="slider-box">
                <input id="${stem.id}Volume" class="stem-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${stem.label} volume" />
              </div>
              <div id="${stem.id}Value" class="stem-value">100%</div>
              <div class="stem-buttons">
                <button id="${stem.id}Solo" class="hardware" type="button">SOLO</button>
              </div>
            </div>
          `;
        });

        $('mixer').innerHTML = html;

        STEMS.forEach(stem => {
          const item = state[stem.id];
          const volumeEl = $(stem.id + 'Volume');
          const soloEl = $(stem.id + 'Solo');
          const valueEl = $(stem.id + 'Value');

          volumeEl.addEventListener('input', (event) => {
            const next = Math.max(0, Math.min(1, Number(event.target.value)));
            item.volume = next;
            valueEl.textContent = Math.round(next * 100) + '%';
            applyMix();
          });

          soloEl.addEventListener('click', () => {
            item.solo = !item.solo;
            soloEl.classList.toggle('active', item.solo);
            applyMix();
          });
        });
      }

      function createAudioElements() {
        STEMS.forEach(stem => {
          const el = new Audio();
          el.src = FILES[stem.id];
          el.preload = 'auto';
          el.playsInline = true;
          el.setAttribute('playsinline', 'true');
          audio[stem.id] = el;

          el.addEventListener('loadedmetadata', () => {
            if (stem.id === 'vocals') {
              duration = el.duration || 0;
            } else {
              duration = Math.max(duration, el.duration || 0);
            }
            $('timeline').max = String(duration || 0);
            updateDisplay(audio.vocals ? audio.vocals.currentTime : 0);
          });

          el.addEventListener('error', () => {
            showError('Could not load: ' + FILES[stem.id]);
          });

          el.addEventListener('ended', () => {
            if (stem.id === 'vocals') {
              pauseAll();
              seekAll(duration);
              setStatus('ENDED');
            }
          });
        });
      }

      function playSample() {
        if (!sampleAudio) {
          sampleAudio = new Audio(SAMPLE_FILE);
          sampleAudio.preload = 'auto';
          sampleAudio.addEventListener('error', () => {
            showError('Could not load: ' + SAMPLE_FILE);
          });
          sampleAudio.addEventListener('ended', () => {
            $('sampleButton').classList.remove('active');
            $('sampleButton').textContent = 'SAMPLE GLOBGLOGABGALAB';
          });
        }

        if (sampleAudio.paused) {
          sampleAudio.currentTime = 0;
          sampleAudio.play()
            .then(() => {
              $('sampleButton').classList.add('active');
              $('sampleButton').textContent = 'SAMPLE · PLAYING';
            })
            .catch(() => {
              showError('Sample playback was blocked. Tap again.');
            });
        } else {
          sampleAudio.pause();
          sampleAudio.currentTime = 0;
          $('sampleButton').classList.remove('active');
          $('sampleButton').textContent = 'SAMPLE GLOBGLOGABGALAB';
        }
      }

      function muteAllToggle() {
        globalMute = !globalMute;
        $('muteAll').textContent = globalMute ? 'UNMUTE ALL' : 'MUTE ALL';
        applyMix();
      }

      function resetAll() {
        pauseAll();
        globalMute = false;
        $('muteAll').textContent = 'MUTE ALL';

        STEMS.forEach(stem => {
          state[stem.id] = { volume: 1, solo: false };
          const volumeEl = $(stem.id + 'Volume');
          const soloEl = $(stem.id + 'Solo');
          const valueEl = $(stem.id + 'Value');

          if (volumeEl) volumeEl.value = '1';
          if (valueEl) valueEl.textContent = '100%';
          if (soloEl) soloEl.classList.remove('active');
        });

        if (sampleAudio) {
          sampleAudio.pause();
          sampleAudio.currentTime = 0;
        }

        $('sampleButton').classList.remove('active');
        $('sampleButton').textContent = 'SAMPLE GLOBGLOGABGALAB';

        clearError();
        seekAll(0);
        setStatus('READY');
        applyMix();
      }

      function bindEvents() {
        $('play').addEventListener('click', () => isPlaying ? pauseAll() : playAll());
        $('sampleButton').addEventListener('click', playSample);
        $('muteAll').addEventListener('click', muteAllToggle);
        $('reset').addEventListener('click', resetAll);

        $('timeline').addEventListener('pointerdown', () => { seeking = true; });
        $('timeline').addEventListener('input', (event) => {
          const next = Number(event.target.value);
          updateDisplay(next);
          STEMS.forEach(stem => {
            const el = audio[stem.id];
            if (!el) return;
            try { el.currentTime = next; } catch (_) {}
          });
        });

        ['pointerup', 'change'].forEach(type => {
          $('timeline').addEventListener(type, () => {
            seeking = false;
            seekAll($('timeline').value);
          });
        });
      }

      renderMixer();
      createAudioElements();
      bindEvents();
      updateDisplay(0);
      applyMix();
    })();
  </script>
</body>
</html>
