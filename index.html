<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>REMOTE CONTROL — STEM LAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090909;--panel:#151515;--line:#333;--text:#f4f4f4;--muted:#999;--on:#eee}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.app{width:min(760px,100%);margin:auto}.header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.eyebrow,.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.eyebrow{margin-bottom:8px}h1{margin:0;font-size:clamp(34px,9vw,64px);line-height:.88;letter-spacing:-.07em}.sub{margin-top:10px}.top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.12em}.time{font-variant-numeric:tabular-nums;white-space:nowrap}.status.playing{color:var(--text)}#timeline{display:block;width:100%;height:38px;margin:5px 0 12px}.transport{margin-bottom:16px}.button,.mini{border:1px solid var(--line);border-radius:9px;background:#181818;color:var(--text);font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.button{width:100%;min-height:48px;font-size:11px}.button.primary{background:var(--on);border-color:var(--on);color:#070707}.stems{display:grid;gap:9px}.stem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stem-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.label{font-size:12px;font-weight:700;letter-spacing:.1em;white-space:nowrap}.value{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.stem-controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}.volume{width:100%;height:36px}.mini{min-width:62px;min-height:40px;padding:0 7px;font-size:9px}.mini.active{background:var(--on);border-color:var(--on);color:#070707}.mini.muted{background:#333}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.error{display:none;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px;color:#ddd;font-size:11px;line-height:1.45}.error.show{display:block}.note{text-align:center;color:#555;font-size:10px;letter-spacing:.12em;margin-top:12px;text-transform:uppercase}input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:3px;background:#4a4a4a;border-radius:3px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border:0;border-radius:50%;background:#f5f5f5;margin-top:-8.5px}input[type=range]::-moz-range-track{height:3px;background:#4a4a4a}input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#f5f5f5}@media(max-width:360px){.mini{min-width:55px;padding:0 5px}.label{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="eyebrow">YE / DONDA</div><h1>REMOTE CONTROL</h1><div class="sub">STEM LAB · REMOTE CONTROL — 2021</div></header>
<section><div class="top"><span id="status">READY</span><span id="time" class="time">00:00 / 00:00</span></div><input id="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline"><div class="transport"><button id="play" class="button primary" type="button">PLAY</button></div></section>
<section id="stems" class="stems" aria-label="Stem controls"></section>
<div class="bottom"><button id="muteAll" class="button" type="button">MUTE ALL</button><button id="reset" class="button" type="button">RESET</button></div>
<div id="error" class="error" role="alert"></div><div class="note">4-STEM SYNCHRONIZED PLAYER</div>
</main>
<script>
(() => {
'use strict';
const AUDIO_FILES={vocals:'Vocals.mp3',drums:'Drums.mp3',bass:'Bass.mp3',other:'Other.mp3'};
const STEMS=[['vocals','🎤 VOCALS'],['drums','🥁 DRUMS'],['bass','🔊 BASS'],['other','🎹 OTHER']];
const audio={},state={};let duration=0,playing=false,raf=0,seeking=false,allMuted=false,snapshot={};
const $=id=>document.getElementById(id);
STEMS.forEach(([id])=>state[id]={volume:1,muted:false,solo:false});
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
function fmt(n){n=Number.isFinite(n)?Math.max(0,n):0;const s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showError(t){$('error').textContent=t;$('error').classList.add('show')}
function clearError(){$('error').textContent='';$('error').classList.remove('show')}
function setStatus(t,c=''){$('status').textContent=t;$('status').className=c}
function hasSolo(){return STEMS.some(([id])=>state[id].solo)}
function applyMix(){const solo=hasSolo();STEMS.forEach(([id])=>{const s=state[id];if(audio[id])audio[id].volume=(s.muted||(solo&&!s.solo))?0:s.volume})}
function display(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));$('timeline').value=n;$('time').textContent=fmt(n)+' / '+fmt(duration)}
function seek(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));STEMS.forEach(([id])=>{try{audio[id].currentTime=n}catch(e){}});display(n)}
function render(){ $('stems').innerHTML=STEMS.map(([id,label])=>`<article class="stem"><div class="stem-head"><span class="label">${label}</span><span id="${id}-value" class="value">100%</span></div><div class="stem-controls"><input id="${id}-volume" class="volume" data-id="${id}" type="range" min="0" max="1" step="0.01" value="1" aria-label="${label} volume"><button class="mini" data-action="mute" data-id="${id}" type="button">MUTE</button><button class="mini" data-action="solo" data-id="${id}" type="button">SOLO</button></div></article>`).join('') }
$('stems').addEventListener('input',e=>{if(!e.target.matches('.volume'))return;const id=e.target.dataset.id;state[id].volume=Number(e.target.value);$(`${id}-value`).textContent=Math.round(state[id].volume*100)+'%';applyMix()});
$('stems').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='mute'){state[id].muted=!state[id].muted;b.classList.toggle('muted',state[id].muted);b.textContent=state[id].muted?'MUTED':'MUTE'}else{state[id].solo=!state[id].solo;b.classList.toggle('active',state[id].solo)}applyMix()});
function stopClock(){cancelAnimationFrame(raf);raf=0}
function clock(){stopClock();const tick=()=>{if(!playing)return;if(!seeking)display(audio.vocals.currentTime);if(!audio.vocals.paused)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function pause(){STEMS.forEach(([id])=>audio[id].pause());playing=false;$('play').textContent='PLAY';setStatus('PAUSED');stopClock()}
function play(){const pos=audio.vocals.currentTime;STEMS.forEach(([id])=>{try{audio[id].currentTime=pos}catch(e){}});applyMix();const promises=STEMS.map(([id])=>audio[id].play());Promise.all(promises).then(()=>{playing=true;$('play').textContent='PAUSE';setStatus('PLAYING','playing');clearError();clock()}).catch(e=>{pause();showError('Playback failed. Check that all four MP3 files are loaded.')})}
STEMS.forEach(([id])=>{const a=new Audio();a.src=AUDIO_FILES[id];a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');audio[id]=a;a.addEventListener('loadedmetadata',()=>{if(id==='vocals')duration=a.duration;else duration=Math.max(duration,a.duration);$('timeline').max=duration;display(audio.vocals.currentTime)});a.addEventListener('error',()=>showError('Could not load: '+AUDIO_FILES[id]));a.addEventListener('ended',()=>{if(id==='vocals'){pause();seek(duration);setStatus('ENDED')}})});
$('play').addEventListener('click',()=>playing?pause():play());$('timeline').addEventListener('pointerdown',()=>seeking=true);$('timeline').addEventListener('input',e=>{display(e.target.value);STEMS.forEach(([id])=>{try{audio[id].currentTime=Number(e.target.value)}catch(x){}})});['pointerup','change'].forEach(ev=>$('timeline').addEventListener(ev,()=>{seeking=false;seek($('timeline').value)}));
$('muteAll').addEventListener('click',()=>{if(!allMuted){STEMS.forEach(([id])=>{snapshot[id]=state[id].muted;state[id].muted=true;const b=document.querySelector(`[data-action="mute"][data-id="${id}"]`);b.classList.add('muted');b.textContent='MUTED'});allMuted=true;$('muteAll').textContent='UNMUTE ALL'}else{STEMS.forEach(([id])=>{state[id].muted=!!snapshot[id];const b=document.querySelector(`[data-action="mute"][data-id="${id}"]`);b.classList.toggle('muted',state[id].muted);b.textContent=state[id].muted?'MUTED':'MUTE'});allMuted=false;$('muteAll').textContent='MUTE ALL'}applyMix()});
$('reset').addEventListener('click',()=>{pause();STEMS.forEach(([id])=>{state[id]={volume:1,muted:false,solo:false};$(`${id}-volume`).value=1;$(`${id}-value`).textContent='100%';document.querySelector(`[data-action="mute"][data-id="${id}"]`).className='mini';document.querySelector(`[data-action="solo"][data-id="${id}"]`).className='mini'});allMuted=false;$('muteAll').textContent='MUTE ALL';clearError();seek(0);setStatus('READY','ready');applyMix()});
render();display(0);applyMix();
})();
</script>
</body>
</html>
