<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>REMOTE CONTROL — STEM LAB</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090909;
      --panel: #121212;
      --line: #2d2d2d;
      --text: #f4f4f4;
      --muted: #8f8f8f;
      --white: #f1f1f1;
      --button: #181818;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    }
    button, input {
      font: inherit;
    }
    .app {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.2rem);
      line-height: 0.88;
      letter-spacing: -0.07em;
      font-weight: 700;
    }
    .subhead {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 20px;
      margin-bottom: 12px;
    }
    .status {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status.ready { color: #d9d9d9; }
    .status.playing { color: #ffffff; }
    .status.paused { color: #d1d1d1; }
    .time {
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 32px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: #3c3c3c;
      border-radius: 3px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5f5f5;
      border: 0;
      margin-top: -7.5px;
    }
    input[type="range"]::-moz-range-track {
      height: 3px;
      background: #3c3c3c;
      border-radius: 3px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5f5f5;
      border: 0;
    }
    .transport {
      margin-bottom: 16px;
    }
    .button {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--button);
      color: var(--text);
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .button.primary {
      background: var(--white);
      color: #111111;
      border-color: var(--white);
    }
    .stem-list {
      display: grid;
      gap: 10px;
    }
    .stem {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .stem-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .stem-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .stem-value {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .stem-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
    }
    .mini {
      min-height: 40px;
      min-width: 62px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1a1a1a;
      color: var(--text);
      padding: 0 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .mini.active {
      background: var(--white);
      color: #0a0a0a;
      border-color: var(--white);
    }
    .mini.muted {
      background: #2d2d2d;
      border-color: #2d2d2d;
    }
    .bottom-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }
    .error {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101010;
      color: #ddd;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
    }
    .error.show {
      display: block;
    }
    .footer-note {
      text-align: center;
      margin-top: 12px;
      color: #5a5a5a;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    @media (max-width: 360px) {
      .mini {
        min-width: 56px;
        padding: 0 6px;
      }
      .stem-name {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="eyebrow">Ye / Donda</div>
      <h1>REMOTE CONTROL</h1>
      <div class="subhead">STEM LAB · REMOTE CONTROL — 2021</div>
    </header>

    <section aria-label="Main transport">
      <div class="status-row">
        <div id="status" class="status ready">READY</div>
        <div id="time" class="time">00:00 / 00:00</div>
      </div>

      <input id="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline" />

      <div class="transport">
        <button id="play" class="button primary" type="button">PLAY</button>
      </div>
    </section>

    <section id="stems" class="stem-list" aria-label="Stem controls"></section>

    <div class="bottom-controls">
      <button id="muteAll" class="button" type="button">MUTE ALL</button>
      <button id="reset" class="button" type="button">RESET</button>
    </div>

    <div id="error" class="error" role="alert" aria-live="assertive"></div>
    <div class="footer-note">4-STEM SYNCHRONIZED PLAYER</div>
  </main>

  <script>
    (() => {
      'use strict';

      const AUDIO_FILES = {
        vocals: 'Vocals.mp3',
        drums: 'Drums.mp3',
        bass: 'Bass.mp3',
        other: 'Other.mp3'
      };

      const STEMS = [
        { id: 'vocals', label: '🎤 VOCALS' },
        { id: 'drums', label: '🥁 DRUMS' },
        { id: 'bass', label: '🔊 BASS' },
        { id: 'other', label: '🎹 OTHER' }
      ];

      const audio = {};
      const gains = {};
      const state = {};
      let audioCtx = null;
      let duration = 0;
      let isPlaying = false;
      let rafId = 0;
      let seeking = false;
      let muteSnapshot = null;

      const $ = (id) => document.getElementById(id);

      STEMS.forEach((stem) => {
        state[stem.id] = { volume: 1, muted: false, solo: false };
      });

      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
        } catch (_) {}
      }

      function formatTime(value) {
        const safe = Number.isFinite(value) ? Math.max(0, value) : 0;
        const totalSeconds = Math.floor(safe);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }

      function setStatus(text, klass = '') {
        const el = $('status');
        el.textContent = text;
        el.className = 'status ' + klass;
      }

      function showError(message) {
        const el = $('error');
        el.textContent = message;
        el.classList.add('show');
      }

      function clearError() {
        const el = $('error');
        el.textContent = '';
        el.classList.remove('show');
      }

      function anySolo() {
        return STEMS.some((stem) => state[stem.id].solo);
      }

      function applyMix() {
        const soloActive = anySolo();

        STEMS.forEach((stem) => {
          const trackState = state[stem.id];
          const gainNode = gains[stem.id];
          const element = audio[stem.id];

          if (!gainNode) {
            if (element) {
              element.volume = (trackState.muted || (soloActive && !trackState.solo)) ? 0 : trackState.volume;
            }
            return;
          }

          const shouldMute = trackState.muted || (soloActive && !trackState.solo);
          gainNode.gain.value = shouldMute ? 0 : trackState.volume;
        });
      }

      function updateTimelineDisplay(value) {
        const safe = Math.max(0, Math.min(Number(value) || 0, duration || 0));
        $('timeline').value = String(safe);
        $('time').textContent = formatTime(safe) + ' / ' + formatTime(duration);
      }

      function seekAll(value) {
        const target = Math.max(0, Math.min(Number(value) || 0, duration || 0));
        STEMS.forEach((stem) => {
          const el = audio[stem.id];
          if (!el) return;
          try {
            el.currentTime = target;
          } catch (_) {}
        });
        updateTimelineDisplay(target);
      }

      function stopAnimation() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      function startAnimation() {
        stopAnimation();
        const tick = () => {
          if (!isPlaying || !audio.vocals) return;
          if (!seeking) {
            updateTimelineDisplay(audio.vocals.currentTime);
          }
          if (!audio.vocals.paused) {
            rafId = requestAnimationFrame(tick);
          }
        };
        rafId = requestAnimationFrame(tick);
      }

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioCtx = new AudioCtx();
        }

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        STEMS.forEach((stem) => {
          const element = audio[stem.id];
          if (!element) return;
          if (gains[stem.id]) return;

          const source = audioCtx.createMediaElementSource(element);
          const gainNode = audioCtx.createGain();
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          gains[stem.id] = gainNode;
        });

        return audioCtx;
      }

      function pauseAll() {
        STEMS.forEach((stem) => {
          const el = audio[stem.id];
          if (!el) return;
          try {
            el.pause();
          } catch (_) {}
        });
        isPlaying = false;
        $('play').textContent = 'PLAY';
        setStatus('PAUSED', 'paused');
        stopAnimation();
      }

      async function playAll() {
        const master = audio.vocals;
        if (!master) {
          showError('Could not load: ' + AUDIO_FILES.vocals);
          return;
        }

        ensureAudioContext();

        const position = master.currentTime || 0;
        STEMS.forEach((stem) => {
          const el = audio[stem.id];
          if (!el) return;
          try {
            el.currentTime = position;
          } catch (_) {}
        });

        applyMix();

        const result = await Promise.allSettled(
          STEMS.map((stem) => {
            const el = audio[stem.id];
            if (!el) return Promise.resolve();
            return el.play().catch(() => Promise.resolve());
          })
        );

        const failed = result.some((item) => item.status === 'rejected');
        if (failed) {
          pauseAll();
          showError('Playback failed. Tap PLAY again.');
          return;
        }

        isPlaying = true;
        $('play').textContent = 'PAUSE';
        setStatus('PLAYING', 'playing');
        clearError();
        startAnimation();
      }

      function renderStems() {
        const container = $('stems');
        container.innerHTML = STEMS.map((stem) => `
          <article class="stem">
            <div class="stem-head">
              <div class="stem-name">${stem.label}</div>
              <div id="${stem.id}Value" class="stem-value">100%</div>
            </div>
            <div class="stem-controls">
              <input id="${stem.id}Volume" class="stem-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${stem.label} volume" />
              <button id="${stem.id}Mute" class="mini" type="button">MUTE</button>
              <button id="${stem.id}Solo" class="mini" type="button">SOLO</button>
            </div>
          </article>
        `).join('');

        STEMS.forEach((stem) => {
          const trackState = state[stem.id];
          const volumeEl = $(stem.id + 'Volume');
          const muteEl = $(stem.id + 'Mute');
          const soloEl = $(stem.id + 'Solo');
          const valueEl = $(stem.id + 'Value');

          volumeEl.addEventListener('input', (event) => {
            const next = Number(event.target.value);
            trackState.volume = next;
            valueEl.textContent = Math.round(next * 100) + '%';
            applyMix();
          });

          muteEl.addEventListener('click', () => {
            trackState.muted = !trackState.muted;
            muteEl.classList.toggle('muted', trackState.muted);
            muteEl.textContent = trackState.muted ? 'MUTED' : 'MUTE';
            applyMix();
          });

          soloEl.addEventListener('click', () => {
            trackState.solo = !trackState.solo;
            soloEl.classList.toggle('active', trackState.solo);
            applyMix();
          });
        });
      }

      function createAudioElements() {
        STEMS.forEach((stem) => {
          const el = new Audio();
          el.src = AUDIO_FILES[stem.id];
          el.preload = 'auto';
          el.playsInline = true;
          el.setAttribute('playsinline', 'true');
          audio[stem.id] = el;

          el.addEventListener('loadedmetadata', () => {
            if (!Number.isFinite(el.duration) || el.duration <= 0) return;
            if (stem.id === 'vocals') {
              duration = el.duration;
            } else {
              duration = Math.max(duration, el.duration);
            }
            $('timeline').max = String(duration || 0);
            updateTimelineDisplay(audio.vocals ? audio.vocals.currentTime : 0);
          });

          el.addEventListener('error', () => {
            showError('Could not load: ' + AUDIO_FILES[stem.id]);
          });

          el.addEventListener('ended', () => {
            if (stem.id === 'vocals') {
              pauseAll();
              seekAll(duration);
              setStatus('ENDED');
            }
          });
        });
      }

      function muteAllToggle() {
        if (!muteSnapshot) {
          muteSnapshot = {};
          STEMS.forEach((stem) => {
            muteSnapshot[stem.id] = state[stem.id].muted;
            state[stem.id].muted = true;
            $(stem.id + 'Mute').classList.add('muted');
            $(stem.id + 'Mute').textContent = 'MUTED';
          });
          $('muteAll').textContent = 'UNMUTE ALL';
        } else {
          STEMS.forEach((stem) => {
            state[stem.id].muted = !!muteSnapshot[stem.id];
            const muteButton = $(stem.id + 'Mute');
            muteButton.classList.toggle('muted', state[stem.id].muted);
            muteButton.textContent = state[stem.id].muted ? 'MUTED' : 'MUTE';
          });
          muteSnapshot = null;
          $('muteAll').textContent = 'MUTE ALL';
        }
        applyMix();
      }

      function resetAll() {
        pauseAll();

        STEMS.forEach((stem) => {
          state[stem.id] = { volume: 1, muted: false, solo: false };
          $(stem.id + 'Volume').value = '1';
          $(stem.id + 'Value').textContent = '100%';
          const muteButton = $(stem.id + 'Mute');
          muteButton.classList.remove('muted');
          muteButton.textContent = 'MUTE';
          const soloButton = $(stem.id + 'Solo');
          soloButton.classList.remove('active');
        });

        muteSnapshot = null;
        $('muteAll').textContent = 'MUTE ALL';
        clearError();
        seekAll(0);
        setStatus('READY', 'ready');
        applyMix();
      }

      function bindEvents() {
        $('play').addEventListener('click', () => {
          if (isPlaying) {
            pauseAll();
          } else {
            playAll();
          }
        });

        $('timeline').addEventListener('pointerdown', () => {
          seeking = true;
        });

        $('timeline').addEventListener('input', (event) => {
          const next = Number(event.target.value);
          updateTimelineDisplay(next);
          STEMS.forEach((stem) => {
            const el = audio[stem.id];
            if (!el) return;
            try {
              el.currentTime = next;
            } catch (_) {}
          });
        });

        $('timeline').addEventListener('pointerup', () => {
          seeking = false;
          seekAll($('timeline').value);
        });

        $('timeline').addEventListener('change', () => {
          seeking = false;
          seekAll($('timeline').value);
        });

        $('muteAll').addEventListener('click', muteAllToggle);
        $('reset').addEventListener('click', resetAll);
      }

      renderStems();
      createAudioElements();
      bindEvents();
      updateTimelineDisplay(0);
      applyMix();
    })();
  </script>
</body>
</html>
