<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>REMOTE CONTROL — STEM LAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090909;--device:#191919;--well:#0d0d0d;--line:#3b3b3b;--text:#ededed;--muted:#8e8e8e;--active:#dedede}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}
.app{width:min(520px,100%);margin:auto}.device{background:var(--device);border:1px solid #484848;border-radius:7px;padding:18px 14px 14px;box-shadow:0 7px #030303,0 16px 32px #000}
.brand,.track,.help{font-size:9px;letter-spacing:.18em;text-align:center;text-transform:uppercase;color:var(--muted)}.model{text-align:center;margin-top:7px;font-size:20px;line-height:1;letter-spacing:.13em;font-weight:700}.track{margin-top:8px}
.transport{margin-top:17px;padding:10px;background:var(--well);border:1px solid #303030;border-radius:3px}.status-row{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px;letter-spacing:.14em}.time{font-variant-numeric:tabular-nums}.timeline{display:block!important;width:100%!important;height:30px!important;margin:4px 0!important}.play-wrap{text-align:center}.play,.hardware,.sample{border:1px solid #5a5a5a;border-radius:3px;background:linear-gradient(#373737,#1b1b1b);color:#ddd;box-shadow:inset 0 1px #555,0 2px #050505;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.play{width:70px;height:32px;background:#d9d9d9;color:#111;border-color:#eee;font-size:9px}.play:active,.hardware:active,.sample:active{transform:translateY(1px)}
.mixer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;padding:13px 8px 11px;background:var(--well);border:1px solid #303030;border-radius:3px}.stem{text-align:center;min-width:0}.stem-name{font-size:9px;letter-spacing:.08em;color:#c7c7c7}.stem-value{font-size:9px;color:var(--muted);margin:3px 0;font-variant-numeric:tabular-nums}.slider-box{height:118px;display:flex;align-items:center;justify-content:center}.stem-slider{width:112px;height:28px;transform:rotate(-90deg);touch-action:none}.stem-slider::-webkit-slider-runnable-track{height:4px;background:#414141;border:1px solid #666}.stem-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border:1px solid #eee;border-radius:2px;background:#c8c8c8}.stem-slider::-moz-range-track{height:4px;background:#414141}.stem-slider::-moz-range-thumb{width:20px;height:20px;border:1px solid #eee;border-radius:2px;background:#c8c8c8}.solo{width:100%;min-height:34px;font-size:8px}.solo.active{background:var(--active);color:#111;border-color:#eee}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bottom .hardware{min-height:38px}.sample-wrap{margin-top:12px;padding-top:11px;border-top:1px solid #303030}.sample{width:100%;min-height:43px;font-size:9px}.sample.active{background:var(--active);color:#111}.error{display:none;margin-top:10px;padding:8px;border:1px solid #555;color:#ddd;font-size:10px;line-height:1.4}.error.show{display:block}.help{margin-top:12px;color:#555;line-height:1.5}@media(max-width:340px){.device{padding-left:10px;padding-right:10px}.mixer{gap:4px;padding-left:4px;padding-right:4px}.stem-name{font-size:8px}.stem-slider{width:106px}}
</style>
</head>
<body>
<main class="app"><section class="device">
<div class="brand">TE / YE — STEM LAB</div><div class="model">REMOTE CONTROL</div><div class="track">DONDA · 2021</div>
<section class="transport"><div class="status-row"><span id="status">READY</span><span id="time" class="time">00:00 / 00:00</span></div><input id="timeline" class="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline"><div class="play-wrap"><button id="play" class="play" type="button">PLAY</button></div></section>
<section id="mixer" class="mixer" aria-label="Stem controls"></section>
<div class="bottom"><button id="muteAll" class="hardware" type="button">MUTE ALL</button><button id="reset" class="hardware" type="button">RESET</button></div>
<div class="sample-wrap"><button id="sampleButton" class="sample" type="button">SAMPLE GLOBGLOGABGALAB</button></div><div id="error" class="error" role="alert"></div>
</section><div class="help">IF SOMETHING DOES NOT WORK, RELOAD THE PAGE</div></main>
<script>
(() => {
'use strict';

// Change audio filenames here only.
const AUDIO_FILES={vocals:'Vocals.mp3',drums:'Drums.mp3',bass:'Bass.mp3',other:'Other.mp3'};
const SAMPLE_FILE='Sample.mp3';
const STEMS=[['vocals','VOC'],['drums','DRUM'],['bass','BASS'],['other','OTHER']];
const audio=Object.create(null);const state=Object.create(null);
let duration=0,isPlaying=false,isSeeking=false,frame=0,muteAllState=false,muteBackup=null,sample=null;
const $=id=>document.getElementById(id);
STEMS.forEach(([id])=>state[id]={volume:1,solo:false});
if(window.Telegram&&window.Telegram.WebApp){try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}}
function formatTime(value){const n=Number.isFinite(value)?Math.max(0,value):0,s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showError(message){$('error').textContent=message;$('error').classList.add('show')}
function clearError(){$('error').textContent='';$('error').classList.remove('show')}
function hasSolo(){return STEMS.some(([id])=>state[id].solo)}
function applyMix(){const solo=hasSolo();STEMS.forEach(([id])=>{audio[id].volume=(solo&&!state[id].solo)?0:state[id].volume})}
function updateDisplay(value){const n=Math.max(0,Math.min(Number(value)||0,duration||0));$('timeline').value=String(n);$('time').textContent=formatTime(n)+' / '+formatTime(duration)}
function seekAll(value){const n=Math.max(0,Math.min(Number(value)||0,duration||0));STEMS.forEach(([id])=>{try{audio[id].currentTime=n}catch(e){}});updateDisplay(n)}
function renderMixer(){let html='';STEMS.forEach(([id,label])=>{html+=`<div class="stem"><div class="stem-name">${label}</div><div class="slider-box"><input id="${id}Volume" class="stem-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${label} volume"></div><div id="${id}Value" class="stem-value">100%</div><button id="${id}Solo" class="hardware solo" type="button">SOLO</button></div>`});$('mixer').innerHTML=html;STEMS.forEach(([id])=>{const slider=$(id+'Volume'),button=$(id+'Solo');slider.addEventListener('input',event=>{state[id].volume=Number(event.target.value);$(id+'Value').textContent=Math.round(state[id].volume*100)+'%';applyMix()});button.addEventListener('click',()=>{state[id].solo=!state[id].solo;button.classList.toggle('active',state[id].solo);applyMix()})})}
function stopClock(){if(frame)cancelAnimationFrame(frame);frame=0}
function startClock(){stopClock();const tick=()=>{if(!isPlaying)return;if(!isSeeking)updateDisplay(audio.vocals.currentTime);if(!audio.vocals.paused)frame=requestAnimationFrame(tick)};frame=requestAnimationFrame(tick)}
function pauseAll(){STEMS.forEach(([id])=>audio[id].pause());isPlaying=false;$('play').textContent='PLAY';$('status').textContent='PAUSED';stopClock()}
function playAll(){const position=audio.vocals.currentTime||0;STEMS.forEach(([id])=>{try{audio[id].currentTime=position}catch(e){}});applyMix();Promise.allSettled(STEMS.map(([id])=>audio[id].play())).then(results=>{if(results.some(result=>result.status==='rejected')){pauseAll();showError('Playback failed. Tap PLAY again.');return}isPlaying=true;$('play').textContent='PAUSE';$('status').textContent='PLAYING';clearError();startClock()})}
function createAudio(){STEMS.forEach(([id])=>{const element=new Audio(AUDIO_FILES[id]);element.preload='auto';element.playsInline=true;element.setAttribute('playsinline','true');audio[id]=element;element.addEventListener('loadedmetadata',()=>{if(id==='vocals')duration=element.duration;else duration=Math.max(duration,element.duration||0);$('timeline').max=String(duration||0);updateDisplay(audio.vocals.currentTime)});element.addEventListener('error',()=>showError('Could not load: '+AUDIO_FILES[id]));element.addEventListener('ended',()=>{if(id==='vocals'){pauseAll();seekAll(duration);$('status').textContent='ENDED'}})})}
function playSample(){if(!sample){sample=new Audio(SAMPLE_FILE);sample.preload='auto';sample.addEventListener('error',()=>showError('Could not load: '+SAMPLE_FILE));sample.addEventListener('ended',()=>{$('sampleButton').classList.remove('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB'})}if(sample.paused){sample.currentTime=0;sample.play().then(()=>{$('sampleButton').classList.add('active');$('sampleButton').textContent='SAMPLE · PLAYING'}).catch(()=>showError('Sample playback was blocked. Tap again.'))}else{sample.pause();sample.currentTime=0;$('sampleButton').classList.remove('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB'}}
$('play').addEventListener('click',()=>isPlaying?pauseAll():playAll());$('sampleButton').addEventListener('click',playSample);
$('timeline').addEventListener('pointerdown',()=>{isSeeking=true});$('timeline').addEventListener('input',event=>{updateDisplay(event.target.value);STEMS.forEach(([id])=>{try{audio[id].currentTime=Number(event.target.value)}catch(e){}})});['pointerup','change'].forEach(type=>$('timeline').addEventListener(type,()=>{isSeeking=false;seekAll($('timeline').value)}));
$('muteAll').addEventListener('click',()=>{if(!muteAllState){muteBackup={};STEMS.forEach(([id])=>{muteBackup[id]=audio[id].volume;audio[id].volume=0});muteAllState=true;$('muteAll').textContent='UNMUTE'}else{STEMS.forEach(([id])=>{audio[id].volume=muteBackup[id]});muteBackup=null;muteAllState=false;$('muteAll').textContent='MUTE ALL';applyMix()}});
$('reset').addEventListener('click',()=>{pauseAll();STEMS.forEach(([id])=>{state[id]={volume:1,solo:false};$(id+'Volume').value='1';$(id+'Value').textContent='100%';$(id+'Solo').classList.remove('active')});muteAllState=false;muteBackup=null;$('muteAll').textContent='MUTE ALL';if(sample){sample.pause();sample.currentTime=0}$('sampleButton').classList.remove('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB';clearError();seekAll(0);$('status').textContent='READY';applyMix()});
renderMixer();createAudio();updateDisplay(0);applyMix();
})();
</script>
</body>
</html>
