<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>REMOTE CONTROL — STEM LAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080808;--device:#171717;--well:#0d0d0d;--line:#373737;--light:#d8d8d8;--muted:#929292;--pressed:#303030}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;background:var(--bg);color:var(--light);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}.app{width:min(100%,520px);margin:auto}.device{background:var(--device);border:1px solid #444;border-radius:7px;padding:18px 14px 13px;box-shadow:0 7px 0 #030303,0 15px 30px #000}.brand,.track,.footer-note{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}.model{text-align:center;margin-top:7px;font-size:20px;line-height:1;letter-spacing:.13em;font-weight:700;color:#e5e5e5}.track{margin-top:8px}.transport{margin-top:17px;padding:10px 10px 8px;background:var(--well);border:1px solid #303030;border-radius:3px}.status-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.status.playing{color:#eee}.time{font-variant-numeric:tabular-nums;letter-spacing:.04em}.timeline{display:block!important;width:100%!important;height:32px!important;margin:4px 0 4px!important}.play-wrap{text-align:center}.play,.hardware,.sample-button{border:1px solid #5a5a5a;border-radius:3px;background:linear-gradient(#373737,#1b1b1b);color:#ddd;box-shadow:inset 0 1px #555,0 2px 0 #050505;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}.play{width:70px;height:32px;font-size:9px;background:#d9d9d9;color:#111;border-color:#eee}.play:active,.hardware:active,.sample-button:active{transform:translateY(1px);box-shadow:inset 0 1px #111,0 1px 0 #050505}.mixer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;padding:13px 8px 11px;background:var(--well);border:1px solid #303030;border-radius:3px}.stem{text-align:center;min-width:0}.stem-name{font-size:9px;letter-spacing:.08em;color:#c7c7c7;white-space:nowrap}.stem-value{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}.stem-slider{display:block!important;width:112px!important;height:28px!important;margin:40px auto!important;transform:rotate(-90deg);touch-action:none}.stem-slider::-webkit-slider-runnable-track{height:4px;background:#414141;border:1px solid #666;border-radius:2px}.stem-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border:1px solid #eee;border-radius:2px;background:#c8c8c8;box-shadow:inset 0 1px #fff,0 2px 2px #000}.stem-slider::-moz-range-track{height:4px;background:#414141;border:1px solid #666}.stem-slider::-moz-range-thumb{width:20px;height:20px;border:1px solid #eee;border-radius:2px;background:#c8c8c8}.stem-buttons{display:grid;gap:6px}.hardware{width:100%;min-height:31px;padding:0 2px;font-size:8px}.hardware.active{background:#ddd;color:#111;border-color:#eee}.hardware.muted{background:#080808;color:#eee;border-color:#777}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bottom .hardware{min-height:38px}.sample-section{margin-top:12px;padding-top:11px;border-top:1px solid #303030}.sample-button{width:100%;min-height:43px;font-size:9px}.sample-button.active{background:#ddd;color:#111;border-color:#eee}.error{display:none;margin-top:10px;padding:8px;border:1px solid #555;background:#141414;color:#ddd;font-size:10px;line-height:1.4}.error.show{display:block}.footer-note{margin-top:12px;color:#555;line-height:1.5}@media(max-width:340px){.device{padding-left:10px;padding-right:10px}.mixer{gap:4px;padding-left:4px;padding-right:4px}.stem-slider{width:106px!important}.stem-name{font-size:8px}.hardware{font-size:7px}}
</style>
</head>
<body><main class="app"><section class="device">
<div class="brand">TE / YE — STEM LAB</div><div class="model">REMOTE CONTROL</div><div class="track">DONDA · 2021</div>
<section class="transport"><div class="status-row"><span id="status">READY</span><span id="time" class="time">00:00 / 00:00</span></div><input id="timeline" class="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="Shared timeline"><div class="play-wrap"><button id="play" class="play" type="button">PLAY</button></div></section>
<section id="stems" class="mixer" aria-label="Stem controls"></section><div class="bottom"><button id="muteAll" class="hardware" type="button">MUTE ALL</button><button id="reset" class="hardware" type="button">RESET</button></div>
<section class="sample-section"><button id="sampleButton" class="sample-button" type="button">SAMPLE GLOBGLOGABGALAB</button></section><div id="error" class="error" role="alert"></div></section><div class="footer-note">IF SOMETHING DOES NOT WORK, RELOAD THE PAGE</div></main>
<script>
(()=>{'use strict';
const AUDIO_FILES={vocals:'Vocals.mp3',drums:'Drums.mp3',bass:'Bass.mp3',other:'Other.mp3'};
const SAMPLE_FILE='Sample.mp3';
const STEMS=[['vocals','VOC'],['drums','DRUM'],['bass','BASS'],['other','OTHER']];
const audio={},state={};let duration=0,playing=false,seeking=false,raf=0,muteBackup=null;let sampleAudio=null;
const $=id=>document.getElementById(id);STEMS.forEach(([id])=>state[id]={volume:1,muted:false,solo:false});
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
function fmt(n){n=Number.isFinite(n)?Math.max(0,n):0;let s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showError(t){$('error').textContent=t;$('error').classList.add('show')}function clearError(){$('error').classList.remove('show')}function hasSolo(){return STEMS.some(([id])=>state[id].solo)}
function applyMix(){const solo=hasSolo();STEMS.forEach(([id])=>{const s=state[id];audio[id].volume=(s.muted||(solo&&!s.solo))?0:s.volume})}
function display(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));$('timeline').value=n;$('time').textContent=fmt(n)+' / '+fmt(duration)}
function seek(n){n=Math.max(0,Math.min(Number(n)||0,duration||0));STEMS.forEach(([id])=>{try{audio[id].currentTime=n}catch(e){}});display(n)}
function render(){let h='';STEMS.forEach(([id,label])=>h+=`<div class="stem"><div class="stem-name">${label}</div><input id="${id}Volume" class="stem-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="${label} volume"><div id="${id}Value" class="stem-value">100%</div><div class="stem-buttons"><button id="${id}Mute" class="hardware" type="button">MUTE</button><button id="${id}Solo" class="hardware" type="button">SOLO</button></div></div>`);$('stems').innerHTML=h;STEMS.forEach(([id])=>{const s=state[id];$(id+'Volume').addEventListener('input',e=>{s.volume=Number(e.target.value);$(id+'Value').textContent=Math.round(s.volume*100)+'%';applyMix()});$(id+'Mute').addEventListener('click',()=>{s.muted=!s.muted;$(id+'Mute').classList.toggle('muted',s.muted);$(id+'Mute').textContent=s.muted?'MUTED':'MUTE';applyMix()});$(id+'Solo').addEventListener('click',()=>{s.solo=!s.solo;$(id+'Solo').classList.toggle('active',s.solo);applyMix()})})}
function stopClock(){cancelAnimationFrame(raf);raf=0}function clock(){stopClock();const frame=()=>{if(!playing)return;if(!seeking)display(audio.vocals.currentTime);if(!audio.vocals.paused)raf=requestAnimationFrame(frame)};raf=requestAnimationFrame(frame)}
function pauseAll(){STEMS.forEach(([id])=>audio[id].pause());playing=false;$('play').textContent='PLAY';$('status').textContent='PAUSED';stopClock()}
async function playAll(){const pos=audio.vocals.currentTime;STEMS.forEach(([id])=>{try{audio[id].currentTime=pos}catch(e){}});applyMix();try{await Promise.all(STEMS.map(([id])=>audio[id].play()));playing=true;$('play').textContent='PAUSE';$('status').textContent='PLAYING';clearError();clock()}catch(e){pauseAll();showError('Playback failed. Tap PLAY again.')}}
STEMS.forEach(([id])=>{const a=new Audio(AUDIO_FILES[id]);a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');audio[id]=a;a.addEventListener('loadedmetadata',()=>{if(id==='vocals')duration=a.duration;else duration=Math.max(duration,a.duration);$('timeline').max=duration;display(audio.vocals.currentTime)});a.addEventListener('error',()=>showError('Could not load: '+AUDIO_FILES[id]));a.addEventListener('ended',()=>{if(id==='vocals'){pauseAll();seek(duration);$('status').textContent='ENDED'}})});
function playSample(){if(!sampleAudio){sampleAudio=new Audio(SAMPLE_FILE);sampleAudio.preload='auto';sampleAudio.addEventListener('error',()=>showError('Could not load: '+SAMPLE_FILE))}if(sampleAudio.paused){sampleAudio.currentTime=0;sampleAudio.play().then(()=>{$('sampleButton').classList.add('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB · PLAYING'}).catch(()=>showError('Sample playback was blocked. Tap again.'))}else{sampleAudio.pause();sampleAudio.currentTime=0;$('sampleButton').classList.remove('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB'}}
$('sampleButton').addEventListener('click',playSample);$('play').addEventListener('click',()=>playing?pauseAll():playAll());$('timeline').addEventListener('pointerdown',()=>seeking=true);$('timeline').addEventListener('input',e=>{display(e.target.value);STEMS.forEach(([id])=>{try{audio[id].currentTime=Number(e.target.value)}catch(x){}})});['change','pointerup'].forEach(type=>$('timeline').addEventListener(type,()=>{seeking=false;seek($('timeline').value)}));
$('muteAll').addEventListener('click',()=>{if(!muteBackup){muteBackup={};STEMS.forEach(([id])=>{muteBackup[id]=state[id].muted;state[id].muted=true;$(id+'Mute').classList.add('muted');$(id+'Mute').textContent='MUTED'});$('muteAll').textContent='UNMUTE'}else{STEMS.forEach(([id])=>{state[id].muted=!!muteBackup[id];$(id+'Mute').classList.toggle('muted',state[id].muted);$(id+'Mute').textContent=state[id].muted?'MUTED':'MUTE'});muteBackup=null;$('muteAll').textContent='MUTE ALL'}applyMix()});
$('reset').addEventListener('click',()=>{pauseAll();STEMS.forEach(([id])=>{state[id]={volume:1,muted:false,solo:false};$(id+'Volume').value=1;$(id+'Value').textContent='100%';$(id+'Mute').className='hardware';$(id+'Mute').textContent='MUTE';$(id+'Solo').className='hardware'});muteBackup=null;$('muteAll').textContent='MUTE ALL';if(sampleAudio){sampleAudio.pause();sampleAudio.currentTime=0}$('sampleButton').classList.remove('active');$('sampleButton').textContent='SAMPLE GLOBGLOGABGALAB';clearError();seek(0);$('status').textContent='READY';applyMix()});
render();display(0);applyMix();
})();
</script></body></html>
